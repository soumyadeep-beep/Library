/* Reader Plus: true black theme, folders, hand-drawn underline, editable highlights.
   Loads after the main script in index.html. Remove the one <script> line to undo everything. */
(()=>{
const st=document.createElement("style");
st.textContent=`
:root.black[data-theme=dark]{background:#000;--bg:#000;--bar:#000;--bd:#1f1f22;--fg:#d6d6d2;--mut:#8a8a90;--page:#000;
 --gl:rgba(0,0,0,.62);--gl-strong:rgba(0,0,0,.9);--gl-bd:rgba(255,255,255,.1);--fill:rgba(255,255,255,.09);--fill-h:rgba(255,255,255,.17);
 --gl-sh:0 0 0 .5px rgba(255,255,255,.08),0 2px 6px rgba(0,0,0,.6),0 16px 40px rgba(0,0,0,.8);
 --gl-sh-sm:0 0 0 .5px rgba(255,255,255,.08),0 4px 14px rgba(0,0,0,.7);
 --gl-sh-lg:0 0 0 .5px rgba(255,255,255,.1),0 30px 80px rgba(0,0,0,.9)}
:root.black body{background:#000}
:root.black .pg{background:#000;box-shadow:0 0 0 .5px rgba(255,255,255,.12)}
:root.black .pg canvas{filter:invert(1) hue-rotate(180deg) brightness(.86)}
:root.black .hl{mix-blend-mode:normal;opacity:.4}
.fbar{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fch{border:0;border-radius:999px;padding:7px 15px;font-weight:500;color:var(--fg);background:var(--gl);
 -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--rim),var(--gl-sh-sm);white-space:nowrap}
.fch.on{background:var(--ac);background:color-mix(in srgb,var(--ac) 82%,transparent);color:#fff}
dialog .fch{box-shadow:none}
body.phone .fbar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
#fodel{color:#ff453a}
`;
document.head.appendChild(st);
const sv=document.createElement("div");
sv.innerHTML='<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12M10 11v5M14 11v5"/></symbol><filter id="rd-hand" filterUnits="userSpaceOnUse" x="-4000" y="-4000" width="16000" height="16000"><feTurbulence type="fractalNoise" baseFrequency=".035 .09" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/></filter></defs></svg>';
document.body.appendChild(sv.firstChild);

/* ---- true black ---- */
THEMES.black=["#000000","#d6d6d2"];
THEME_ITEMS.push({t:"True black",v:"black",sw:"#000000"});
const _sy=syncUI;
syncUI=function(){_sy();const k=S.theme==="black",r=document.documentElement;if(k)r.dataset.theme="dark";r.classList.toggle("black",k);
 const m=document.querySelector('meta[name=theme-color]');if(m)m.content=(THEMES[S.theme]||THEMES.light)[0]};

/* ---- underline: hand-drawn or clean, three intensities ---- */
ulSpec=function(){const i=Math.max(0,Math.min(2,(+S.ulh||2)-1));return{w:[1.6,2.6,4][i],o:[.55,.8,1][i]}};
const ulStamp=u=>{if(u.m==null){const k=ulSpec();u.h=k.w;u.o=k.o;u.m=S.uls==="clean"?"clean":"hand"}};
drawEpUl=function(u){
 const s={stroke:u.c,"stroke-width":u.h+"px","stroke-opacity":String(u.o==null?1:u.o)};
 if(u.m==="hand"){s["stroke-linecap"]="round";s.filter="url(#rd-hand)"}
 try{rend.annotations.underline(u.cfi,{},null,"ul",s)}catch(e){}
};
for(const nm of["markEpub","markWord"]){const o=window[nm];window[nm]=function(...a){
 const n=rb&&rb.ul?rb.ul.length:0;o.apply(this,a);
 if(rb&&rb.ul)rb.ul.slice(n).forEach(u=>{ulStamp(u);try{rend.annotations.remove(u.cfi,"underline")}catch(e){}drawEpUl(u)});
}}
const _pl=pdfLine;
pdfLine=function(e){const n=rb&&rb.ul?rb.ul.length:0;_pl(e);
 if(rb&&rb.ul&&rb.ul.length>n){rb.ul.slice(n).forEach(ulStamp);const pg=e.target.closest&&e.target.closest(".pg");if(pg)drawUl(pg)}};
drawUl=function(p){
 const l=p.querySelector(".ulr");if(!l)return;l.innerHTML="";
 (rb&&rb.ul||[]).filter(u=>u.t==="p"&&u.n===+p.dataset.n).forEach(u=>{
  const i=document.createElement("i");
  Object.assign(i.style,{left:u.l*100+"%",top:u.tp*100+"%",width:u.w*100+"%",height:u.h+"px",background:u.c,opacity:u.o==null?1:u.o});
  if(u.m==="hand"){i.style.borderRadius="999px";i.style.filter="url(#rd-hand)"}
  l.appendChild(i);
 });
};
$("bUlS").onclick=e=>{
 const mk=(t,f)=>{const b=document.createElement("button");b.className="mi";b.textContent=t;b.onclick=f;return b};
 const w=document.createElement("div"),l=document.createElement("label");l.className="mi";l.style.flexDirection="row";l.innerHTML='Colour <input type="color">';
 const i=l.querySelector("input");i.value=S.ulc;i.oninput=ev=>{S.ulc=ev.target.value;saveS()};
 w.append(
  mk("Stroke: "+(S.uls==="clean"?"clean line":"hand-drawn")+" (switch)",()=>{S.uls=S.uls==="clean"?"hand":"clean";saveS();vanish($("menu"))}),
  mk("Trail: "+(S.ulm==="word"?"word by word":"whole line")+" (switch)",()=>{S.ulm=S.ulm==="word"?"line":"word";saveS();vanish($("menu"))}),
  l,
  mk("Clear underlines in this book",()=>{
   if(!rb||!rb.ul||!rb.ul.length||!confirm("Remove all underlines in this book?"))return;
   if(rb.type==="epub"){rb.ul.forEach(u=>{try{rend.annotations.remove(u.cfi,"underline")}catch(x){}});ulSet=new Set()}
   rb.ul=[];$("pdf").querySelectorAll(".pg").forEach(drawUl);put(rb);vanish($("menu"));
  }));
 menu(e.currentTarget,[{t:"Intensity: Light",v:"1"},{t:"Intensity: Medium",v:"2"},{t:"Intensity: Bold",v:"3"}],v=>{S.ulh=v;saveS()},String(S.ulh||"2"),w);
};

/* ---- highlights: tap one to recolour or remove it ---- */
addEpubHl=function(h){
 const dk=S.theme==="dark"||S.theme==="black";
 try{rend.annotations.highlight(h.cfi,{},e=>editHl(h,e&&e.clientX,e&&e.clientY),"hl",{fill:h.color,"fill-opacity":dk?".4":".45","mix-blend-mode":dk?"normal":"multiply"})}catch(e){}
};
const pdel=document.createElement("button");pdel.className="ib";pdel.hidden=true;pdel.title="Remove highlight";pdel.innerHTML='<svg class="i"><use href="#i-trash"/></svg>';
$("pop").appendChild(pdel);
const _sp=showPop;
showPop=function(x,y,s,bot){_sp(x,y,s,bot);const ed=!!(s&&s.edit);pdel.hidden=!ed;$("pundo").hidden=ed};
const _ah=applyHl;
applyHl=function(c){if(sel&&sel.edit&&rb){recolor(sel.edit,c);return}_ah(c)};
function editHl(h,x,y){
 if(!rb)return;
 if(typeof x!=="number"||typeof y!=="number"){const v=$("view").getBoundingClientRect();x=v.left+v.width/2;y=v.top+v.height/2}
 showPop(x,y,{edit:h},y+24);
}
function redrawHl(){if(rb&&rb.type==="pdf")$("pdf").querySelectorAll(".pg").forEach(drawHl)}
function recolor(h,c){
 rb.hl.filter(x=>x.g===h.g).forEach(x=>{x.color=c;if(x.t==="e"){try{rend.annotations.remove(x.cfi,"highlight")}catch(e){}addEpubHl(x)}});
 redrawHl();put(rb);hidePop();
}
pdel.onclick=()=>{
 if(!sel||!sel.edit||!rb)return;const g=sel.edit.g;
 rb.hl.filter(x=>x.g===g&&x.t==="e").forEach(x=>{try{rend.annotations.remove(x.cfi,"highlight")}catch(e){}});
 rb.hl=rb.hl.filter(x=>x.g!==g);redrawHl();put(rb);hidePop();
};
$("pdf").addEventListener("click",e=>{
 if(!rb||rb.type!=="pdf"||!getSelection().isCollapsed)return;
 const pg=e.target.closest&&e.target.closest(".pg");if(!pg)return;
 const q=(pg.querySelector(".pgi")||pg).getBoundingClientRect(),n=+pg.dataset.n,fx=(e.clientX-q.left)/q.width,fy=(e.clientY-q.top)/q.height;
 const h=(rb.hl||[]).find(h=>h.t==="p"&&h.n===n&&h.r.some(([l,t,w,hh])=>fx>=l&&fx<=l+w&&fy>=t&&fy<=t+hh));
 if(h)editHl(h,e.clientX,e.clientY);
});

/* ---- folders (like playlists: a book can be in several) ---- */
let curF=null,foId=null,foBook=false;
const folders=()=>S.folders||(S.folders=[]);
const inF=(b,id)=>(b.fl||[]).includes(id);
const dlg=document.createElement("dialog");dlg.id="fodlg";
dlg.innerHTML='<h3 id="fotitle" style="margin:0">New folder</h3><label>Name<input id="fon" maxlength="40" placeholder="e.g. Comics, Exam prep, Favourites"></label><div class="row"><button id="fodel" hidden>Delete folder</button><span class="grow"></span><button id="focancel">Cancel</button><button id="fosave" class="on">Save</button></div>';
document.body.appendChild(dlg);
dlg.addEventListener("cancel",e=>{e.preventDefault();softClose(dlg)});
function openFo(id,fromBook){
 foId=id;foBook=fromBook;const f=folders().find(x=>x.id===id);
 $("fon").value=f?f.name:"";$("fotitle").textContent=f?"Rename folder":"New folder";
 $("fodel").hidden=!f;$("fodel").textContent="Delete folder";dlg.showModal();setTimeout(()=>$("fon").focus(),60);
}
$("fon").addEventListener("keydown",e=>{if(e.key==="Enter")$("fosave").click()});
$("focancel").onclick=()=>softClose(dlg);
$("fosave").onclick=()=>{
 const n=$("fon").value.trim();if(!n)return;
 if(foId){const f=folders().find(x=>x.id===foId);if(f)f.name=n}
 else{const f={id:"f"+Math.random().toString(36).slice(2,9),name:n};folders().push(f);
  if(foBook&&mb)(mb.fl=mb.fl||[]).push(f.id);else curF=f.id}
 saveS();if(mb)drawDfl();render();softClose(dlg);
};
$("fodel").onclick=async()=>{
 if($("fodel").textContent==="Delete folder"){$("fodel").textContent="Click again to confirm";return}
 const id=foId;S.folders=folders().filter(f=>f.id!==id);
 for(const b of books)if(inF(b,id)){b.fl=b.fl.filter(x=>x!==id);await put(b)}
 if(mb&&mb.fl)mb.fl=mb.fl.filter(x=>x!==id);
 if(curF===id)curF=null;saveS();if(mb)drawDfl();render();softClose(dlg);
};
const _r=render;
render=function(){
 const all=books;if(curF)books=all.filter(b=>inF(b,curF));
 try{_r()}finally{books=all}
 $("none").hidden=all.length>0;
 const fs=folders();if(curF&&!fs.some(f=>f.id===curF))curF=null;
 if(!all.length&&!fs.length)return;
 const bar=document.createElement("div");bar.className="fbar";
 const chip=(t,on,fn)=>{const b=document.createElement("button");b.className="fch"+(on?" on":"");b.textContent=t;b.onclick=fn;bar.appendChild(b);return b};
 chip("All books",!curF,()=>{curF=null;render()});
 fs.forEach(f=>chip(f.name+" \u00b7 "+all.filter(b=>inF(b,f.id)).length,curF===f.id,()=>{curF=f.id;render()}));
 chip("+ New folder",false,()=>openFo(null,false));
 if(curF)chip("\u22ef",false,()=>openFo(curF,false)).title="Rename or delete this folder";
 $("grid").prepend(bar);
 if(curF&&!$("grid").querySelector(".card")){const m=document.createElement("div");m.className="mut";m.style.cssText="grid-column:1/-1;padding:30px 0;text-align:center";
  m.textContent="This folder is empty. Open a book's \u22ef menu and tick this folder, or add new books while it is open.";$("grid").appendChild(m)}
};
$("q").oninput=render;
const row=document.createElement("div");row.style.margin="10px 0";
row.innerHTML='<div class="mut" style="margin-bottom:6px">Folders</div><div id="dfl" class="fbar"></div>';
$("rst").parentElement.before(row);
function drawDfl(){
 const w=$("dfl");w.innerHTML="";if(!mb)return;
 folders().forEach(f=>{const b=document.createElement("button"),on=inF(mb,f.id);b.className="fch"+(on?" on":"");b.textContent=f.name;
  b.onclick=()=>{mb.fl=on?mb.fl.filter(x=>x!==f.id):[...(mb.fl||[]),f.id];drawDfl()};w.appendChild(b)});
 const n=document.createElement("button");n.className="fch";n.textContent="+ New";n.onclick=()=>openFo(null,true);w.appendChild(n);
}
const _d=details;details=function(b){_d(b);drawDfl()};
const _af=addFiles;
addFiles=async function(fs){
 const n=books.length,f=curF;await _af(fs);
 if(f)for(const b of books.slice(n)){b.fl=[...(b.fl||[]),f];await put(b)}
 render();
};
syncUI();render();
})();
